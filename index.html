  function collectTradeDraft() {
    const d = ui.draft;
    if (!d) return;
    const dateEl = document.getElementById("f-date");
    const timeEl = document.getElementById("f-time");
    const accEl = document.getElementById("f-account");
    const contractsEl = document.getElementById("f-contracts");
    const amountEl = document.getElementById("f-amount");
    const notesEl = document.getElementById("f-notes");
    const customSym = document.getElementById("f-custom-symbol");
    const customSetup = document.getElementById("f-custom-setup");
    if (dateEl) d.date = dateEl.value;
    if (timeEl) d.time = timeEl.value;
    if (accEl) d.accountId = accEl.value;
    if (contractsEl) d.contracts = Math.max(1, parseInt(contractsEl.value, 10) || 1);
    if (amountEl) {
      const amt = Math.abs(parseAmount(amountEl.value));
      d.pnl = (d.sign === "neg" ? -1 : 1) * amt;
    }
    if (notesEl) d.notes = notesEl.value;
    if (d.symbol === "__custom" && customSym) d.symbolCustom = customSym.value.trim();
    if (d.setup === "__custom" && customSetup) d.setupCustom = customSetup.value.trim();
  }

  function tradeSheetBody(d) {
    const customSym = d.symbol === "__custom" || (d.symbol && SYMBOLS.indexOf(d.symbol) === -1 && d.symbol !== "");
    const knownSetups = state.setups || [];
    const customSetup = d.setup === "__custom" || (d.setup && knownSetups.indexOf(d.setup) === -1);
    const sign = d.sign || (d.pnl < 0 ? "neg" : "pos");
    const amount = Math.abs(Number(d.pnl) || 0);
    const amountText = amount ? String(amount) : "";
    const symbolChips = SYMBOLS.map((s) => '<button type="button" class="chip ' + (d.symbol === s ? "on" : "") + '" data-action="draft-symbol" data-id="' + s + '">' + s + "</button>").join("") +
      '<button type="button" class="chip ' + (customSym ? "on" : "") + '" data-action="draft-symbol" data-id="__custom">Otro</button>';
    const setupChips = knownSetups.map((s) => '<button type="button" class="chip ' + (!customSetup && d.setup === s ? "on" : "") + '" data-action="draft-setup" data-id="' + esc(s) + '">' + esc(s) + "</button>").join("") +
      '<button type="button" class="chip ' + (customSetup ? "on" : "") + '" data-action="draft-setup" data-id="__custom">Nuevo</button>';
    const stars = [1,2,3,4,5].map((n) => '<button type="button" class="star ' + (d.rating >= n ? "on" : "") + '" data-action="draft-rating" data-id="' + n + '" aria-label="' + n + ' de 5">' + ICO.star + "</button>").join("");
    const emotionChips = EMOTIONS.map((e) => '<button type="button" class="chip ' + (d.emotion === e.id ? "on" : "") + '" data-action="draft-emotion" data-id="' + e.id + '">' + e.label + "</button>").join("");
    const accountOpts = (state.accounts || []).map((a) => '<option value="' + esc(a.id) + '"' + (a.id === d.accountId ? " selected" : "") + ">" + esc(a.name) + "</option>").join("");
    const mediaBlock = mediaGridHTML(d.media || [], true);

    return '<div class="pnl-hero"><div class="lbl">Resultado</div><input id="f-amount" inputmode="decimal" enterkeyhint="done" placeholder="0" value="' + esc(amountText) + '" class="' + (sign === "neg" ? "down" : amount ? "up" : "") + '" aria-label="Resultado en dólares"><div class="sign-row"><div class="segmented signed"><button type="button" class="' + (sign === "pos" ? "on pos" : "") + '" data-action="draft-sign" data-id="pos">+</button><button type="button" class="' + (sign === "neg" ? "on neg" : "") + '" data-action="draft-sign" data-id="neg">\u2212</button></div></div></div>' +
      '<div class="group"><label class="row"><span class="row-label">Cuenta</span><select id="f-account" class="row-field">' + accountOpts + '</select></label><label class="row"><span class="row-label">Fecha</span><input id="f-date" type="date" value="' + esc(d.date || todayISO()) + '"></label><label class="row"><span class="row-label">Hora</span><input id="f-time" type="time" value="' + esc(d.time || nowTime()) + '"></label><label class="row"><span class="row-label">Contratos</span><input id="f-contracts" type="number" min="1" step="1" inputmode="numeric" value="' + esc(d.contracts || 1) + '"></label></div>' +
      '<p class="hint">Símbolo</p><div class="chip-wrap" style="margin-bottom:12px">' + symbolChips + "</div>" +
      (customSym ? '<div class="group"><label class="row"><span class="row-label">Símbolo</span><input id="f-custom-symbol" type="text" value="' + esc(d.symbolCustom || (SYMBOLS.indexOf(d.symbol) === -1 ? d.symbol : "") || "") + '" placeholder="MES, M2K\u2026"></label></div>' : "") +
      '<p class="hint">Dirección</p><div class="segmented" style="margin-bottom:16px"><button type="button" class="' + (d.side !== "short" ? "on" : "") + '" data-action="draft-side" data-id="long">Long</button><button type="button" class="' + (d.side === "short" ? "on" : "") + '" data-action="draft-side" data-id="short">Short</button></div>' +
      '<p class="hint">Setup</p><div class="chip-wrap" style="margin-bottom:12px">' + setupChips + "</div>" +
      (customSetup ? '<div class="group"><label class="row"><span class="row-label">Setup</span><input id="f-custom-setup" type="text" value="' + esc(d.setupCustom || (knownSetups.indexOf(d.setup) === -1 ? d.setup : "") || "") + '" placeholder="Ruptura de rango\u2026"></label></div>' : "") +
      '<div class="group"><div class="row wrap"><span class="row-label">\u00bfReglas?</span><div class="segmented"><button type="button" class="' + (d.followedRules !== false ? "on" : "") + '" data-action="draft-rules" data-id="yes">Sí</button><button type="button" class="' + (d.followedRules === false ? "on" : "") + '" data-action="draft-rules" data-id="no">No</button></div></div><div class="row wrap"><span class="row-label">Noticia</span><div class="segmented"><button type="button" class="' + (!d.news ? "on" : "") + '" data-action="draft-news" data-id="no">No</button><button type="button" class="' + (d.news ? "on" : "") + '" data-action="draft-news" data-id="yes">Sí</button></div></div><div class="row wrap"><span class="row-label">Ejecución</span><div class="stars" role="radiogroup" aria-label="Nota de ejecución">' + stars + "</div></div></div>" +
      '<p class="hint">Emoción</p><div class="chip-wrap" style="margin-bottom:16px">' + emotionChips + "</div>" +
      '<div class="group"><div class="row-note"><textarea id="f-notes" placeholder="Notas de la operación\u2026">' + esc(d.notes || "") + "</textarea></div></div>" +
      '<p class="hint">Fotos y vídeos</p>' + mediaBlock +
      '<input id="f-shot" type="file" accept="image/*,video/*" multiple hidden>' +
      (d.id ? '<button type="button" class="destructive" data-action="delete-trade" data-id="' + esc(d.id) + '">Eliminar trade</button>' : "");
  }

  function mediaFlagHTML(t) {
    const items = t.media || [];
    const photos = items.filter(function (m) { return m.kind === "image"; }).length + ((t.screenshot && !items.length) ? 1 : 0);
    const videos = items.filter(function (m) { return m.kind === "video"; }).length;
    if (!photos && !videos) return "";
    let label;
    if (photos && videos) label = (photos + videos) + " adjuntos";
    else if (videos) label = videos === 1 ? "1 vídeo" : videos + " vídeos";
    else label = photos === 1 ? "1 foto" : photos + " fotos";
    return '<span class="flag">' + esc(label) + "</span>";
  }

  function mediaGridHTML(items, removable) {
    const tiles = (items || []).map(function (m) {
      const warn = m.kind === "video" && m.size > VIDEO_WARN_BYTES;
      return '<div class="media-tile" data-media-id="' + esc(m.id) + '"><button type="button" class="media-open" data-action="view-media" data-id="' + esc(m.id) + '" aria-label="' + (m.kind === "video" ? "Ver vídeo" : "Ver foto") + '"><span class="media-ph"></span>' +
        (m.kind === "video" ? '<span class="play-badge"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5L8 5.5z"/></svg></span>' : "") +
        "</button>" +
        (removable ? '<button type="button" class="media-x" data-action="remove-media" data-id="' + esc(m.id) + '" aria-label="Quitar">&times;</button>' : "") +
        (warn ? '<div class="media-warn">Más de 100 MB</div>' : "") +
        "</div>";
    }).join("");
    const add = removable ? '<button type="button" class="media-add" data-action="draft-shot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 5"/><circle cx="8.5" cy="9" r="1.2"/></svg><span>Añadir</span></button>' : "";
    const hasBig = (items || []).some(function (m) { return m.kind === "video" && m.size > VIDEO_WARN_BYTES; });
    const note = hasBig ? '<p class="hint">Hay un vídeo de más de 100 MB. Puede ocupar bastante espacio en el iPhone.</p>' : '<p class="hint">Las fotos se comprimen. Los vídeos se quedan en el teléfono y no entran en la copia JSON.</p>';
    return '<div class="media-grid">' + tiles + add + "</div>" + note;
  }

  function hydrateMediaTiles(root) {
    const scope = root || document;
    const tiles = scope.querySelectorAll(".media-tile[data-media-id]");
    tiles.forEach(function (tile) {
      const id = tile.getAttribute("data-media-id");
      mediaGet(id).then(function (rec) {
        if (!rec || !tile.isConnected) return;
        const src = rec.thumb || (rec.kind === "image" ? rec.blob : null);
        const ph = tile.querySelector(".media-ph");
        if (src && ph) {
          const img = document.createElement("img");
          img.alt = rec.kind === "video" ? "Vídeo" : "Foto";
          img.src = cachedUrl(id + "-thumb", src);
          ph.replaceWith(img);
        }
      }).catch(function (err) { console.warn(err); });
    });
  }

  function refreshTradeSheet() {
    collectTradeDraft();
    document.getElementById("sheetBody").innerHTML = tradeSheetBody(ui.draft);
    bindShotInput();
    hydrateMediaTiles(document.getElementById("sheetBody"));
  }

  function bindShotInput() {
    const input = document.getElementById("f-shot");
    if (!input) return;
    input.addEventListener("change", function (e) {
      const files = e.target.files;
      if (!files || !files.length) return;
      addMediaFiles(files).finally(function () {
        input.value = "";
      });
    });
  }

  function discardDraftMedia(draft) {
    (draft.newMediaIds || []).forEach(function (id) {
      mediaDelete(id).catch(function (err) { console.warn(err); });
    });
  }

  function addMediaFiles(fileList) {
    const files = Array.prototype.slice.call(fileList || []);
    if (!files.length || !ui.draft) return Promise.resolve();
    collectTradeDraft();
    ui.draft.media = ui.draft.media || [];
    ui.draft.newMediaIds = ui.draft.newMediaIds || [];
    let warned = false;
    let chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        const video = isVideoFile(file);
        const image = isImageFile(file);
        if (!video && !image) {
          toast("Solo se pueden añadir fotos o vídeos.");
          return;
        }
        if (video && file.size > VIDEO_WARN_BYTES) warned = true;
        const id = uid();
        const job = video
          ? videoPoster(file).then(function (thumb) {
              return mediaPut({
                id: id,
                blob: file,
                thumb: thumb,
                kind: "video",
                mime: file.type || "video/mp4",
                size: file.size,
                name: file.name || "video"
              }).then(function () { return { kind: "video", mime: file.type || "video/mp4", size: file.size, name: file.name || "video" }; });
            })
          : compressImageBlob(file).then(function (blob) {
              return mediaPut({
                id: id,
                blob: blob,
                thumb: null,
                kind: "image",
                mime: "image/jpeg",
                size: blob.size,
                name: file.name || "foto.jpg"
              }).then(function () { return { kind: "image", mime: "image/jpeg", size: blob.size, name: file.name || "foto.jpg" }; });
            });
        return job.then(function (meta) {
          if (!ui.draft) return;
          ui.draft.media = ui.draft.media.concat([{ id: id, kind: meta.kind, mime: meta.mime, size: meta.size, name: meta.name }]);
          ui.draft.newMediaIds = ui.draft.newMediaIds.concat([id]);
        });
      }).catch(function (err) {
        console.warn(err);
        toast("No se pudo guardar un archivo. ¿Hay espacio en el iPhone?");
      });
    });
    return chain.then(function () {
      if (warned) toast("Hay un vídeo de más de 100 MB. Puede ocupar bastante espacio.");
      if (ui.draft) refreshTradeSheet();
    });
  }

  function removeDraftMedia(id) {
    if (!ui.draft) return;
    collectTradeDraft();
    ui.draft.media = (ui.draft.media || []).filter(function (m) { return m.id !== id; });
    const isNew = (ui.draft.newMediaIds || []).indexOf(id) !== -1;
    if (isNew) {
      ui.draft.newMediaIds = ui.draft.newMediaIds.filter(function (x) { return x !== id; });
      mediaDelete(id).catch(function (err) { console.warn(err); });
    } else {
      ui.draft.removedMedia = (ui.draft.removedMedia || []).concat([id]);
    }
    refreshTradeSheet();
  }

  function closeViewer() {
    const viewer = document.getElementById("viewer");
    const video = viewer.querySelector("video");
    if (video) {
      try { video.pause(); } catch (err) {}
    }
    if (ui.viewerUrl) {
      URL.revokeObjectURL(ui.viewerUrl);
      ui.viewerUrl = null;
    }
    viewer.classList.remove("on");
    setTimeout(function () {
      if (!viewer.classList.contains("on")) {
        viewer.hidden = true;
        viewer.innerHTML = "";
      }
    }, 260);
  }

  function openViewer(id) {
    const items = (ui.draft && ui.draft.media) ? ui.draft.media : (ui.viewerList || []);
    const idx = items.findIndex(function (m) { return m.id === id; });
    const meta = idx >= 0 ? items[idx] : { id: id };
    mediaGet(id).then(function (rec) {
      if (!rec || !rec.blob) { toast("No se pudo abrir el archivo."); return; }
      if (ui.viewerUrl) URL.revokeObjectURL(ui.viewerUrl);
      const url = URL.createObjectURL(rec.blob);
      ui.viewerUrl = url;
      const kind = meta.kind || rec.kind;
      const isVideo = kind === "video";
      const viewer = document.getElementById("viewer");
      const prev = idx > 0 ? items[idx - 1] : null;
      const next = idx >= 0 && idx < items.length - 1 ? items[idx + 1] : null;
      viewer.hidden = false;
      viewer.innerHTML = '<div class="viewer-bar"><button type="button" data-action="close-viewer">Cerrar</button><div class="viewer-title">' +
        (isVideo ? "Vídeo" : "Foto") + (items.length > 1 && idx >= 0 ? " · " + (idx + 1) + " de " + items.length : "") +
        '</div><span style="min-width:64px;text-align:right">' +
        (prev ? '<button type="button" data-action="view-media" data-id="' + esc(prev.id) + '">Anterior</button>' : "") +
        (next ? '<button type="button" data-action="view-media" data-id="' + esc(next.id) + '">Siguiente</button>' : "") +
        '</span></div><div class="viewer-stage">' +
        (isVideo
          ? '<video src="' + url + '" controls playsinline webkit-playsinline></video>'
          : '<img src="' + url + '" alt="Foto del trade">') +
        "</div>";
      requestAnimationFrame(function () { viewer.classList.add("on"); });
    }).catch(function (err) {
      console.warn(err);
      toast("No se pudo abrir el archivo.");
    });
  }


  function openTradeSheet(id) {
    const existing = id && (state.trades || []).find((t) => t.id === id);
    if (existing) {
      ui.draft = Object.assign({}, existing, {
        sign: existing.pnl < 0 ? "neg" : "pos",
        symbolCustom: SYMBOLS.indexOf(existing.symbol) !== -1 ? "" : existing.symbol,
        setupCustom: (state.setups || []).indexOf(existing.setup) !== -1 ? "" : existing.setup,
        media: (existing.media || []).slice(),
        newMediaIds: [],
        removedMedia: []
      });
    } else {
      const defaultAccount = (ui.accountFilter !== "all" && accountById(ui.accountFilter))
        ? ui.accountFilter
        : ((state.accounts[0] && state.accounts[0].id) || "");
      ui.draft = {
        id: null,
        accountId: defaultAccount,
        date: todayISO(),
        time: nowTime(),
        symbol: "NQ",
        side: "long",
        contracts: 1,
        pnl: 0,
        sign: "pos",
        setup: "Sin especificar",
        followedRules: true,
        emotion: "",
        news: false,
        notes: "",
        screenshot: "",
        media: [],
        newMediaIds: [],
        removedMedia: [],
        rating: 0
      };
    }
    ui.draftCommitted = false;
    openSheet("trade", existing ? "Editar trade" : "Nuevo trade", tradeSheetBody(ui.draft));
    bindShotInput();
    hydrateMediaTiles(document.getElementById("sheetBody"));
  }

  function saveTrade() {
    collectTradeDraft();
    const d = ui.draft;
    if (!d) return;
    if (!d.accountId) { toast("Elige una cuenta."); return; }
    if (!d.date) { toast("Indica la fecha."); return; }
    let symbol = d.symbol === "__custom" ? (d.symbolCustom || "").trim().toUpperCase() : (d.symbol || "").trim().toUpperCase();
    if (!symbol) { toast("Indica un símbolo."); return; }
    let setup = d.setup === "__custom" ? (d.setupCustom || "").trim() : (d.setup || "").trim();
    if (!setup) setup = "Sin especificar";
    if ((state.setups || []).indexOf(setup) === -1) state.setups = (state.setups || []).concat([setup]);
    const amount = document.getElementById("f-amount") ? Math.abs(parseAmount(document.getElementById("f-amount").value)) : Math.abs(d.pnl || 0);
    const pnl = (d.sign === "neg" ? -1 : 1) * amount;
    const record = {
      id: d.id || uid(),
      accountId: d.accountId,
      date: d.date,
      time: d.time || "00:00",
      symbol: symbol,
      side: d.side === "short" ? "short" : "long",
      contracts: Math.max(1, parseInt(d.contracts, 10) || 1),
      pnl: pnl,
      setup: setup,
      followedRules: d.followedRules !== false,
      emotion: d.emotion || "",
      news: !!d.news,
      notes: d.notes || "",
      screenshot: "",
      media: (d.media || []).map(function (m) {
        return { id: m.id, kind: m.kind, mime: m.mime, size: m.size, name: m.name };
      }),
      rating: Number(d.rating) || 0,
      createdAt: d.createdAt || new Date().toISOString()
    };
    (d.removedMedia || []).forEach(function (id) {
      mediaDelete(id).catch(function (err) { console.warn(err); });
    });
    ui.draftCommitted = true;
    if (d.id) {
      state.trades = state.trades.map((t) => t.id === d.id ? record : t);
      toast("Trade actualizado");
    } else {
      state.trades = state.trades.concat([record]);
      toast("Trade guardado");
    }
    closeSheet();
    persist();
  }

  function accountSheetBody(d) {
    const statusOpts = STATUSES.map((s) => '<option value="' + s.id + '"' + (d.status === s.id ? " selected" : "") + ">" + s.label + "</option>").join("");
    return '<div class="group"><label class="row"><span class="row-label">Nombre</span><input id="a-name" type="text" value="' + esc(d.name || "") + '" placeholder="LucidPro 50K"></label><label class="row"><span class="row-label">Firma</span><input id="a-firm" type="text" value="' + esc(d.firm || "") + '" placeholder="Lucid Trading"></label><label class="row"><span class="row-label">Estado</span><select id="a-status">' + statusOpts + "</select></label></div>" +
      '<div class="group"><label class="row"><span class="row-label">Tamaño</span><input id="a-size" inputmode="decimal" value="' + esc(d.size != null ? d.size : (d.startBalance || "")) + '"></label><label class="row"><span class="row-label">Balance inicial</span><input id="a-start" inputmode="decimal" value="' + esc(d.startBalance != null ? d.startBalance : "") + '"></label><label class="row"><span class="row-label">Objetivo</span><input id="a-target" inputmode="decimal" value="' + esc(d.targetBalance != null ? d.targetBalance : "") + '"></label><label class="row"><span class="row-label">MLL</span><input id="a-mll" inputmode="decimal" value="' + esc(d.mll != null ? d.mll : "") + '"></label><label class="row"><span class="row-label">Límite diario</span><input id="a-daily" inputmode="decimal" placeholder="Sin límite" value="' + esc(hasDailyLimit(d) ? d.dailyLossLimit : "") + '"></label></div>' +
      '<p class="hint">Déjalo vacío si la cuenta no tiene límite de pérdida diario. El balance actual se calcula solo: inicial más el resultado de los trades de esta cuenta.</p>' +
      (d.id ? '<button type="button" class="destructive" data-action="delete-account" data-id="' + esc(d.id) + '">Eliminar cuenta</button>' : "");
  }

  function openAccountSheet(id) {
    const existing = id && accountById(id);
    ui.draft = existing ? Object.assign({}, existing) : {
      id: null, name: "", firm: "", size: 50000, startBalance: 50000,
      targetBalance: "", mll: "", dailyLossLimit: null, status: "eval", excludeFromStats: false
    };
    openSheet("account", existing ? "Editar cuenta" : "Nueva cuenta", accountSheetBody(ui.draft));
  }

  function saveAccount() {
    const name = (document.getElementById("a-name").value || "").trim();
    if (!name) { toast("Ponle un nombre a la cuenta."); return; }
    const record = {
      id: (ui.draft && ui.draft.id) || uid(),
      name: name,
      firm: (document.getElementById("a-firm").value || "").trim(),
      status: document.getElementById("a-status").value || "eval",
      size: parseAmount(document.getElementById("a-size").value),
      startBalance: parseAmount(document.getElementById("a-start").value),
      targetBalance: parseAmount(document.getElementById("a-target").value),
      mll: parseAmount(document.getElementById("a-mll").value),
      dailyLossLimit: parseOptionalAmount(document.getElementById("a-daily").value),
      excludeFromStats: !!(ui.draft && ui.draft.excludeFromStats)
    };
    if (ui.draft && ui.draft.id) {
      state.accounts = state.accounts.map((a) => a.id === record.id ? Object.assign({}, a, record) : a);
      toast("Cuenta actualizada");
    } else {
      state.accounts = state.accounts.concat([record]);
      toast("Cuenta creada");
    }
    closeSheet();
    persist();
  }

  function openRuleSheet(id) {
    const existing = id && (state.rules || []).find((r) => r.id === id);
    ui.draft = existing ? { id: existing.id, text: existing.text } : { id: null, text: "" };
    const body = '<div class="group"><div class="row-note"><textarea id="r-text" placeholder="Escribe la regla\u2026" rows="4">' + esc(ui.draft.text) + "</textarea></div></div>";
    openSheet("rule", existing ? "Editar regla" : "Nueva regla", body);
    setTimeout(function () {
      const el = document.getElementById("r-text");
      if (el) el.focus();
    }, 400);
  }

  function saveRule() {
    const text = ((document.getElementById("r-text") && document.getElementById("r-text").value) || "").trim();
    if (!text) { toast("Escribe la regla."); return; }
    if (ui.draft && ui.draft.id) {
      const rule = (state.rules || []).find((r) => r.id === ui.draft.id);
      if (rule) rule.text = text;
      toast("Regla actualizada");
    } else {
      state.rules = (state.rules || []).concat([{ id: uid(), text: text }]);
      toast("Regla añadida");
    }
    closeSheet();
    persist();
  }

  function openSettings() {
    const body = '<p class="hint">Tus datos viven en este iPhone. Haz una copia de vez en cuando.</p><div class="group"><button type="button" class="settings-row" data-action="export-json">Exportar copia JSON</button><button type="button" class="settings-row" data-action="export-csv">Exportar trades en CSV</button><button type="button" class="settings-row" data-action="import-json">Importar JSON</button></div><p class="hint">La copia JSON incluye las fotos. Los vídeos se quedan en el iPhone y no entran en el archivo, porque pesan demasiado.</p><div class="group"><button type="button" class="settings-row danger" data-action="restore-seed">Restaurar datos de ejemplo</button><button type="button" class="settings-row danger" data-action="wipe">Borrar todo</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><p class="hint">Journal · tus operaciones, en un solo sitio.</p>';
    openSheet("settings", "Ajustes", body, { saveLabel: "Cerrar" });
    const file = document.getElementById("importFile");
    if (file) file.addEventListener("change", onImportFile);
  }

  function download(filename, text, mime) {
    const blob = new Blob([text], { type: mime || "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportJSON() {
    const payload = JSON.parse(JSON.stringify(state));
    let skippedVideos = 0;
    const trades = payload.trades || [];
    let chain = Promise.resolve();
    trades.forEach(function (trade) {
      chain = chain.then(function () {
        const kept = [];
        const items = trade.media || [];
        let inner = Promise.resolve();
        items.forEach(function (m) {
          if (m.kind === "video") { skippedVideos += 1; return; }
          inner = inner.then(function () {
            return mediaGet(m.id).then(function (rec) {
              if (!rec || !rec.blob) return;
              return blobToDataURL(rec.blob).then(function (dataURL) {
                kept.push({ id: m.id, kind: "image", mime: m.mime, size: m.size, name: m.name, dataURL: dataURL });
              });
            });
          });
        });
        return inner.then(function () {
          trade.media = kept;
          delete trade.screenshot;
        });
      });
    });
    return chain.then(function () {
      download("journal-" + todayISO() + ".json", JSON.stringify(payload, null, 2), "application/json");
      toast(skippedVideos ? "Copia exportada. Los vídeos no se incluyen." : "Copia exportada");
    }).catch(function (err) {
      console.warn(err);
      toast("No se pudo preparar la copia.");
    });
  }

  function csvEscape(v) {
    const s = String(v == null ? "" : v);
    if (/[",\n;]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCSV() {
    const header = ["fecha","hora","cuenta","simbolo","direccion","contratos","pnl","setup","reglas","emocion","noticia","ejecucion","notas"];
    const lines = [header.join(";")];
    sortTrades(state.trades || []).forEach((t) => {
      const acc = accountById(t.accountId);
      lines.push([
        t.date, t.time, acc ? acc.name : "", t.symbol, t.side, t.contracts, t.pnl,
        t.setup, t.followedRules === false ? "no" : "si", emotionLabel(t.emotion), t.news ? "si" : "no",
        t.rating || "", (t.notes || "").replace(/\n/g, " ")
      ].map(csvEscape).join(";"));
    });
    download("journal-trades-" + todayISO() + ".csv", lines.join("\n"), "text/csv");
    toast("CSV exportado");
  }

  function ingestImportedMedia(data) {
    data = data || {};
    data.trades = data.trades || [];
    let chain = Promise.resolve();
    data.trades.forEach(function (trade) {
      chain = chain.then(function () {
        const next = [];
        let inner = Promise.resolve();
        const items = trade.media || [];
        if (trade.screenshot && !items.length) {
          items.push({ kind: "image", dataURL: trade.screenshot, name: "captura.jpg" });
        }
        items.forEach(function (m) {
          inner = inner.then(function () {
            if (m && m.dataURL) {
              const id = m.id || uid();
              const blob = dataURLToBlob(m.dataURL);
              return mediaPut({
                id: id,
                blob: blob,
                thumb: null,
                kind: "image",
                mime: blob.type || "image/jpeg",
                size: blob.size,
                name: m.name || "foto.jpg"
              }).then(function () {
                next.push({ id: id, kind: "image", mime: blob.type || "image/jpeg", size: blob.size, name: m.name || "foto.jpg" });
              });
            }
            if (m && m.id && m.kind !== "video") {
              next.push({ id: m.id, kind: m.kind || "image", mime: m.mime, size: m.size, name: m.name });
            }
            return null;
          });
        });
        return inner.then(function () {
          trade.media = next;
          delete trade.screenshot;
        });
      });
    });
    return chain.then(function () { return data; });
  }

  function onImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.trades) || !Array.isArray(data.accounts)) {
          toast("El archivo no parece un journal.");
          return;
        }
        confirmAction("¿Sustituir los datos actuales por este archivo?", "Esta acción reemplaza cuentas, trades y reglas. Los vídeos no viajan en el JSON.", function () {
          mediaClear().catch(function (err) { console.warn(err); }).then(function () {
            return ingestImportedMedia(data);
          }).then(function (next) {
            state = migrateState(next);
            if (!state.setups) state.setups = ["Sin especificar"];
            if (!state.checkins) state.checkins = {};
            if (!state.settings) state.settings = { hideInstallTip: false };
            closeSheet();
            persist();
            toast("Datos importados");
          }).catch(function (err) {
            console.warn(err);
            toast("No se pudieron importar las fotos.");
          });
        });
      } catch (err) {
        toast("No se pudo leer el JSON.");
        console.warn(err);
      }
    };
    reader.readAsText(file);
  }

  function confirmAction(title, text, onYes) {
    const el = document.getElementById("confirm");
    const back = document.getElementById("confirmBackdrop");
    el.hidden = false;
    back.hidden = false;
    el.innerHTML = '<div class="confirm-card"><div class="confirm-msg"><h3>' + esc(title) + "</h3>" + (text ? "<p>" + esc(text) + "</p>" : "") + '</div><button type="button" class="danger" id="confirmYes">Eliminar</button></div><button type="button" class="confirm-cancel" id="confirmNo">Cancelar</button>';
    requestAnimationFrame(() => {
      back.classList.add("on");
      el.classList.add("on");
    });
    const yes = document.getElementById("confirmYes");
    const lower = title.toLowerCase();
    if (lower.indexOf("restaurar") !== -1 || lower.indexOf("sustituir") !== -1 || lower.indexOf("borrar") !== -1) {
      yes.textContent = "Confirmar";
    }
    const close = function () {
      el.classList.remove("on");
      back.classList.remove("on");
      setTimeout(() => { el.hidden = true; back.hidden = true; el.innerHTML = ""; }, 360);
    };
    yes.onclick = function () { close(); onYes(); };
    document.getElementById("confirmNo").onclick = close;
    back.onclick = close;
  }

  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("on");
    clearTimeout(ui.toastTimer);
    ui.toastTimer = setTimeout(() => el.classList.remove("on"), 2200);
  }

  function promptText(message, initial) {
    const value = window.prompt(message, initial || "");
    return value;
  }

  function onClick(e) {
    const target = e.target.closest("[data-action]");
    if (!target) {
      if (e.target.id === "backdrop") closeSheet();
      return;
    }
    const action = target.dataset.action;
    const id = target.dataset.id;
    if (action === "noop") { e.stopPropagation(); return; }

    if (action === "tab") { ui.tab = target.dataset.tab; render(); return; }
    if (action === "new-trade") { openTradeSheet(); return; }
    if (action === "edit-trade") { openTradeSheet(id); return; }
    if (action === "close-sheet") { closeSheet(); return; }
    if (action === "save-sheet") {
      if (ui.sheet === "trade") saveTrade();
      else if (ui.sheet === "account") saveAccount();
      else if (ui.sheet === "rule") saveRule();
      else closeSheet();
      return;
    }
    if (action === "settings") { openSettings(); return; }
    if (action === "hide-install") {
      state.settings = state.settings || {};
      state.settings.hideInstallTip = true;
      persist();
      return;
    }
    if (action === "dash-account") { ui.accountFilter = id; ui._keepScroll = true; render(); return; }
    if (action === "month-prev") {
      const d = ui.month || new Date();
      ui.month = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      ui._keepScroll = true;
      render();
      return;
    }
    if (action === "month-next") {
      const d = ui.month || new Date();
      ui.month = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      ui._keepScroll = true;
      render();
      return;
    }
    if (action === "filter-result") { ui.tradeResult = id; ui._keepScroll = true; render(); return; }
    if (action === "filter-account") { ui.tradeAccount = id; ui._keepScroll = true; render(); return; }
    if (action === "filter-setup") { ui.tradeSetup = id; ui._keepScroll = true; render(); return; }
    if (action === "toggle-exclude") {
      return;
    }
    if (action === "new-account") { openAccountSheet(); return; }
    if (action === "edit-account") { openAccountSheet(id); return; }
    if (action === "delete-account") {
      confirmAction("¿Eliminar esta cuenta?", "Los trades de esta cuenta también se borrarán.", function () {
        const gone = (state.trades || []).filter((t) => t.accountId === id);
        collectMediaIds(gone).forEach(function (mid) { mediaDelete(mid).catch(function (err) { console.warn(err); }); });
        state.accounts = state.accounts.filter((a) => a.id !== id);
        state.trades = state.trades.filter((t) => t.accountId !== id);
        closeSheet();
        persist();
        toast("Cuenta eliminada");
      });
      return;
    }
    if (action === "delete-trade") {
      confirmAction("¿Eliminar este trade?", "Esta acción no se puede deshacer.", function () {
        const trade = (state.trades || []).find((t) => t.id === id);
        collectMediaIds(trade ? [trade] : []).forEach(function (mid) { mediaDelete(mid).catch(function (err) { console.warn(err); }); });
        ui.draftCommitted = true;
        state.trades = state.trades.filter((t) => t.id !== id);
        closeSheet();
        persist();
        toast("Trade eliminado");
      });
      return;
    }
    if (action === "new-rule") { openRuleSheet(null); return; }
    if (action === "edit-rule") { openRuleSheet(id); return; }
    if (action === "delete-rule") {
      confirmAction("¿Eliminar esta regla?", "", function () {
        state.rules = state.rules.filter((r) => r.id !== id);
        persist();
      });
      return;
    }
    if (action === "toggle-check") {
      const today = todayISO();
      state.checkins[today] = state.checkins[today] || {};
      state.checkins[today][id] = !state.checkins[today][id];
      ui._keepScroll = true;
      persist();
      return;
    }
    if (action === "draft-sign") { collectTradeDraft(); ui.draft.sign = id; refreshTradeSheet(); return; }
    if (action === "draft-symbol") { collectTradeDraft(); ui.draft.symbol = id; refreshTradeSheet(); return; }
    if (action === "draft-side") { collectTradeDraft(); ui.draft.side = id; refreshTradeSheet(); return; }
    if (action === "draft-setup") { collectTradeDraft(); ui.draft.setup = id; refreshTradeSheet(); return; }
    if (action === "draft-rules") { collectTradeDraft(); ui.draft.followedRules = id !== "no"; refreshTradeSheet(); return; }
    if (action === "draft-news") { collectTradeDraft(); ui.draft.news = id === "yes"; refreshTradeSheet(); return; }
    if (action === "draft-emotion") {
      collectTradeDraft();
      ui.draft.emotion = ui.draft.emotion === id ? "" : id;
      refreshTradeSheet();
      return;
    }
    if (action === "draft-rating") {
      collectTradeDraft();
      ui.draft.rating = Number(ui.draft.rating) === Number(id) ? 0 : Number(id);
      refreshTradeSheet();
      return;
    }
    if (action === "draft-shot") {
      const input = document.getElementById("f-shot");
      if (input) input.click();
      return;
    }
    if (action === "remove-media") {
      e.stopPropagation();
      removeDraftMedia(id);
      return;
    }
    if (action === "view-media") {
      e.stopPropagation();
      if (!(ui.draft && ui.draft.media)) {
        const tradeBtn = target.closest(".trade");
        /* viewer list already set if coming from draft */
      }
      openViewer(id);
      return;
    }
    if (action === "close-viewer") { closeViewer(); return; }
    if (action === "export-json") { exportJSON(); return; }
    if (action === "export-csv") { exportCSV(); return; }
    if (action === "import-json") {
      const input = document.getElementById("importFile");
      if (input) input.click();
      return;
    }
    if (action === "restore-seed") {
      confirmAction("¿Restaurar los datos de ejemplo?", "Se sustituyen las cuentas, trades y reglas actuales.", function () {
        mediaClear().catch(function (err) { console.warn(err); }).then(function () {
          state = seedState();
          closeSheet();
          persist();
          toast("Datos de ejemplo restaurados");
        });
      });
      return;
    }
    if (action === "wipe") {
      confirmAction("¿Borrar todo el journal?", "Esta acción no se puede deshacer, salvo que tengas una copia exportada.", function () {
        mediaClear().catch(function (err) { console.warn(err); }).then(function () {
          state = {
            version: DATA_VERSION,
            accounts: [],
            trades: [],
            rules: DEFAULT_RULES.map((text) => ({ id: uid(), text: text })),
            setups: ["Sin especificar"],
            checkins: {},
            settings: { hideInstallTip: !!(state.settings && state.settings.hideInstallTip) }
          };
          closeSheet();
          persist();
          toast("Journal vaciado");
        });
      });
    }
  }

  function init() {
    ui.month = new Date();
    document.addEventListener("click", onClick);
    document.getElementById("content").addEventListener("scroll", updateTopbar, { passive: true });
    document.getElementById("content").addEventListener("change", function (e) {
      const el = e.target;
      if (el && el.dataset.action === "toggle-exclude") {
        const acc = accountById(el.dataset.id);
        if (acc) {
          acc.excludeFromStats = !!el.checked;
          ui._keepScroll = true;
          persist();
        }
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        const viewer = document.getElementById("viewer");
        if (viewer && !viewer.hidden) { closeViewer(); return; }
        if (!document.getElementById("confirm").hidden) return;
        if (ui.sheet) closeSheet();
      }
    });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function (err) { console.warn("SW", err); });
    }

    mediaReady().catch(function (err) { console.warn(err); }).then(function () {
      state = loadState();
      return migrateLegacyScreenshots(state);
    }).then(function () {
      saveState();
      render();
    }).catch(function (err) {
      console.warn(err);
      state = state || loadState();
      saveState();
      render();
    });
  }

  init();
})();

  </script>
